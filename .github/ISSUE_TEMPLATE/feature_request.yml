name: Feature request
description: Suggest a new check, engine, script option or skill change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to make, and where the plugin got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like it to do. Numbers beat adjectives here too.
